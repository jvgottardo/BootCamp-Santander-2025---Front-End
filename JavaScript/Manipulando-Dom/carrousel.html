<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrossel - Exemplo</title>
  <style>
    /* reset simples */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: Inter, system-ui, Arial;
      background: #111;
      color: #fff;
      padding: 2rem
    }

    /* container do carrossel */
    .carousel {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* viewport - esconde overflow */
    .carousel__viewport {
      overflow: hidden;
      border-radius: 8px;
      background: #222;
      touch-action: pan-y;
      /* permite swipes horizontais via pointer events */
    }

    /* track: todos os slides em linha */
    .carousel__track {
      display: flex;
      transition: transform .45s cubic-bezier(.22, .9, .34, 1);
      will-change: transform;
    }

    /* cada slide ocupa 100% da viewport */
    .carousel__slide {
      min-width: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 320px;
      background: linear-gradient(180deg, #444, #333);
      color: #fff;
      position: relative;
    }

    .carousel__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(.95) saturate(.95);
    }

    .carousel__caption {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: rgba(0, 0, 0, .45);
      padding: .5rem .75rem;
      border-radius: 6px;
      font-size: 1rem;
    }

    /* botões prev/next */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, .45);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .carousel__btn:hover {
      background: rgba(0, 0, 0, .6)
    }

    .carousel__btn:active {
      transform: translateY(-50%) scale(.98)
    }

    .carousel__btn--prev {
      left: 12px
    }

    .carousel__btn--next {
      right: 12px
    }

    /* indicadores (dots) */
    .carousel__indicators {
      display: flex;
      gap: .5rem;
      justify-content: center;
      margin-top: .75rem;
    }

    .carousel__indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .35);
      cursor: pointer;
    }

    .carousel__indicator[aria-current="true"] {
      background: #fff;
      transform: scale(1.2);
    }

    /* responsivo: altura menor em telas pequenas */
    @media (max-width:600px) {
      .carousel__slide {
        height: 200px
      }

      .carousel__caption {
        font-size: .9rem
      }
    }
  </style>
</head>

<body>

  <h2>Carrossel - exemplo básico (arraste, teclas, autoplay)</h2>

  <section class="carousel" aria-roledescription="carousel" aria-label="Galeria de imagens">
    <div class="carousel__viewport" id="viewport">
      <div class="carousel__track" id="track">
        <div class="carousel__slide">
          <img src="https://picsum.photos/id/1015/1200/600" alt="Montanhas" loading="lazy">
          <div class="carousel__caption">Slide 1 — Montanhas</div>
        </div>
        <div class="carousel__slide">
          <img src="https://picsum.photos/id/1016/1200/600" alt="Praia" loading="lazy">
          <div class="carousel__caption">Slide 2 — Praia</div>
        </div>
        <div class="carousel__slide">
          <img src="https://picsum.photos/id/1018/1200/600" alt="Cidade" loading="lazy">
          <div class="carousel__caption">Slide 3 — Cidade</div>
        </div>
      </div>
    </div>

    <button class="carousel__btn carousel__btn--prev" id="prevBtn" aria-label="Slide anterior">‹</button>
    <button class="carousel__btn carousel__btn--next" id="nextBtn" aria-label="Próximo slide">›</button>

    <div class="carousel__indicators" id="indicators" aria-hidden="false"></div>
  </section>

  <script>
    /* ---------- Seletores ---------- */
    const carousel = document.querySelector('.carousel');
    const viewport = document.getElementById('viewport');
    const track = document.getElementById('track');
    const slides = Array.from(track.children);
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicators = document.getElementById('indicators');

    /* ---------- Estado ---------- */
    let index = 0; // slide atual
    let autoplayDelay = 4000;
    let autoplayId = null;

    /* ---------- Inicialização: cria os indicadores (dots) ---------- */
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel__indicator';
      dot.type = 'button';
      dot.dataset.index = i;
      dot.setAttribute('aria-label', `Ir para slide ${i + 1}`);
      if (i === 0) dot.setAttribute('aria-current', 'true');
      indicators.appendChild(dot);
    });

    const dots = Array.from(indicators.children);

    /* ---------- Função que reposiciona o track conforme index ---------- */
    function update() {
      const w = viewport.offsetWidth;                 // largura atual da viewport (px)
      const offset = -index * w;                      // deslocamento em px
      track.style.transition = 'transform .45s cubic-bezier(.22,.9,.34,1)';
      track.style.transform = `translateX(${offset}px)`;

      // atualiza dots
      dots.forEach((d, i) => {
        if (i === index) d.setAttribute('aria-current', 'true');
        else d.removeAttribute('aria-current');
      });

      // desabilita botões se estiver nas extremidades (opcional)
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;
    }

    /* ---------- navegação ---------- */
    nextBtn.addEventListener('click', () => {
      index = Math.min(index + 1, slides.length - 1);
      update();
      resetAutoplay();
    });

    prevBtn.addEventListener('click', () => {
      index = Math.max(index - 1, 0);
      update();
      resetAutoplay();
    });

    // dots clicáveis
    dots.forEach(d => d.addEventListener('click', (e) => {
      index = Number(e.currentTarget.dataset.index);
      update();
      resetAutoplay();
    }));

    /* ---------- autoplay (opcional) ---------- */
    function startAutoplay() {
      if (autoplayId) return;
      autoplayId = setInterval(() => {
        index = (index + 1) % slides.length; // ciclo contínuo
        update();
      }, autoplayDelay);
    }
    function stopAutoplay() {
      if (!autoplayId) return;
      clearInterval(autoplayId);
      autoplayId = null;
    }
    function resetAutoplay() {
      stopAutoplay();
      startAutoplay();
    }

    // pausar autoplay ao passar mouse / focar
    carousel.addEventListener('mouseenter', stopAutoplay);
    carousel.addEventListener('mouseleave', startAutoplay);
    carousel.addEventListener('focusin', stopAutoplay);
    carousel.addEventListener('focusout', startAutoplay);

    /* ---------- suporte a teclado ---------- */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { nextBtn.click(); }
      if (e.key === 'ArrowLeft') { prevBtn.click(); }
    });

    /* ---------- suporte a drag/swipe (pointer events) ---------- */
    let isDragging = false;
    let startX = 0;
    let currentTranslate = 0;

    viewport.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      // anula a transição para acompanhar o dedo
      track.style.transition = 'none';
      viewport.setPointerCapture(e.pointerId);
      stopAutoplay();
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const w = viewport.offsetWidth;
      // move o track em px (index * w + dx)
      track.style.transform = `translateX(${-index * w + dx}px)`;
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      viewport.releasePointerCapture(e.pointerId);
      const dx = e.clientX - startX;
      const w = viewport.offsetWidth;
      const threshold = w * 0.15; // precisa arrastar 15% da largura para trocar
      if (dx < -threshold) {
        index = Math.min(index + 1, slides.length - 1);
      } else if (dx > threshold) {
        index = Math.max(index - 1, 0);
      }
      update();
      resetAutoplay();
    }

    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    viewport.addEventListener('pointerleave', (e) => {
      // se o ponteiro sair enquanto arrasta, finaliza parecido com pointerup
      if (isDragging) endDrag(e);
    });

    /* ---------- resize: recalcula posição (mantém o slide atual) ---------- */
    window.addEventListener('resize', () => update());

    /* ---------- start ---------- */
    update();
    startAutoplay();
  </script>

</body>

</html>
